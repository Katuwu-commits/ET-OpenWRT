name: Build Pure LK OpenWrt for Arcadyan Meteor 2 5G CPE (MediaTek T750)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'dts/**'
      - '.github/workflows/arcadyan_t750_build.yml'

jobs:
  build:
    name: Build LK OpenWrt for Arcadyan Meteor 2
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison gasm awk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget device-tree-compiler android-sdk-libsparse-utils
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone MediaTek T750 LK OpenWrt Source
        run: |
          git clone --depth 1 https://github.com/linjunyidesign/fiberhome-lg6121f-openwrt.git openwrt

      - name: Inject Arcadyan DTS & Configure LK Device Rules
        run: |
          cd openwrt
          
          # 1. Copy user's exact committed DTS from repo dts/ folder
          echo "Injecting user's mt6890-arcadyan-meteor-2.dts into target/linux/mediatek/dts/..."
          cp ../dts/mt6890-arcadyan-meteor-2.dts target/linux/mediatek/dts/mt6890-arcadyan-meteor-2.dts

          # 2. Append Device/arcadyan_meteor-2 definition to mt6890.mk with LK bootimage support
          MK_FILE="target/linux/mediatek/image/mt6890.mk"
          echo "Appending Device/arcadyan_meteor-2 to $MK_FILE..."
          cat <<'EOF' >> $MK_FILE

define Device/arcadyan_meteor-2
  DEVICE_VENDOR := Arcadyan
  DEVICE_MODEL := Meteor 2 5G CPE
  DEVICE_DTS := mt6890-arcadyan-meteor-2
  DEVICE_DTS_DIR := ../dts
  SUPPORTED_DEVICES := arcadyan,meteor-2
  IMAGES := boot.img ubi.img
  IMAGE/boot.img := lk-bootimage
  DEVICE_PACKAGES := \
    kmod-mt7915e \
    kmod-mt76 \
    mt7915e-firmware \
    kmod-usb-net-mbim \
    kmod-usb-serial-option \
    modemmanager \
    luci-proto-modemmanager \
    kmod-crypto-hw-safexcel \
    wpad-basic-mbedtls \
    wireguard-tools \
    luci-proto-wireguard
endef
TARGET_DEVICES += arcadyan_meteor-2
EOF

          # 3. Update & Install Feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Target Configuration
        run: |
          cd openwrt
          cat <<EOF > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt6890=y
          CONFIG_TARGET_DEVICE_mediatek_mt6890_DEVICE_arcadyan_meteor-2=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_kmod-mt76=y
          CONFIG_PACKAGE_mt7915e-firmware=y
          CONFIG_PACKAGE_kmod-usb-net-mbim=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          CONFIG_PACKAGE_kmod-crypto-hw-safexcel=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          EOF
          make defconfig

      - name: Download Source Packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile LK OpenWrt Firmware
        run: |
          cd openwrt
          echo "Building LK boot.img & OpenWrt firmware specifically for Arcadyan Meteor 2..."
          make -j$(nproc) V=s || make -j1 V=s

      - name: Organize Firmware Output
        run: |
          cd openwrt
          mkdir -p bin_output
          find bin/targets/ -type f \( -name "*.img" -o -name "*.bin" -o -name "*.tar.gz" -o -name "manifest*" \) -exec cp {} bin_output/ \;
          echo "Firmware files built successfully:"
          ls -la bin_output/

      - name: Upload OpenWrt Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Arcadyan-Meteor2-LK-OpenWrt
          path: openwrt/bin_output/
