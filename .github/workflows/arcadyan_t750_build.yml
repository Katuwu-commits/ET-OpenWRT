name: Build Pure OpenWrt for Arcadyan Meteor 2 5G CPE (MediaTek T750)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'dts/**'
      - '.github/workflows/arcadyan_t750_build.yml'

jobs:
  build:
    name: Build OpenWrt for Arcadyan T750
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison gasm awk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget device-tree-compiler
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone MediaTek T750 OpenWrt Source
        run: |
          git clone --depth 1 https://github.com/linjunyidesign/fiberhome-lg6121f-openwrt.git openwrt

      - name: Inject Arcadyan DTS & Device Definitions
        run: |
          cd openwrt
          
          # Copy custom DTS file if provided in dts/ folder
          if [ -f "../dts/mt6890-arcadyan-meteor-2.dts" ]; then
            echo "Injecting custom Arcadyan Meteor 2 DTS..."
            cp ../dts/mt6890-arcadyan-meteor-2.dts target/linux/mediatek/dts/mt6890-arcadyan-meteor-2.dts
          else
            echo "No custom DTS found in dts/ directory. Using default MT6890 DTS template."
          fi

          # Update feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Configuration
        run: |
          cd openwrt
          cat <<EOF > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt6890=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_kmod-usb-net-mbim=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          CONFIG_PACKAGE_kmod-crypto-hw-safexcel=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          EOF
          make defconfig

      - name: Download Source Packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile OpenWrt Firmware
        run: |
          cd openwrt
          echo "Building OpenWrt image with $(nproc) threads..."
          make -j$(nproc) V=s || make -j1 V=s

      - name: Organize Firmware Output
        run: |
          cd openwrt
          mkdir -p bin_output
          find bin/targets/ -type f \( -name "*.bin" -o -name "*.img" -o -name "*.tar.gz" -o -name "manifest*" \) -exec cp {} bin_output/ \;
          echo "Firmware files built successfully:"
          ls -la bin_output/

      - name: Upload OpenWrt Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Arcadyan-Meteor2-T750-OpenWrt
          path: openwrt/bin_output/
